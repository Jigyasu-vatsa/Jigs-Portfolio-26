<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Page Not Found | Jigyasu Vatsa | jigyasu.jigsy.in</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var fullRequested = path + search + hash;
        var isPdf = /\.pdf(\?.*|#.*)?$/i.test(path) || /^\/?pdfiles\//i.test(path);
        var errType = isPdf ? 'pdf_not_found' : 'github_unavailable';
        var target =
          '/?__err_path=' +
          encodeURIComponent(fullRequested) +
          '&__err_type=' +
          encodeURIComponent(errType) +
          '&__err_source=github';
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 640px;
        width: 100%;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: #93c5fd;
        background: rgba(30, 58, 138, 0.5);
        border: 1px solid rgba(59, 130, 246, 0.4);
        margin-bottom: 12px;
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { color: #cbd5e1; line-height: 1.6; font-size: 14px; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="card">
        <span class="badge">404 · Page Not Found</span>
        <h1>This route took an unexpected detour</h1>
        <p>
          The page, PDF document, or GitHub Pages resource you requested is currently unavailable or moved on jigyasu.jigsy.in.
        </p>
        <a href="/">Return to Home</a>
      </div>
    </noscript>
  </body>
</html>
